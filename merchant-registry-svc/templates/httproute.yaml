{{- if .Values.gateway.enabled -}}
{{- $ctx := . -}}
{{- range $i, $entry := .Values.gateway.hosts }}
{{- if $i }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-%s" $ctx.Release.Name (regexReplaceAll "[^a-zA-Z0-9]+" $entry.host "-") | trunc 63 | trimSuffix "-" }}
  namespace: {{ $ctx.Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ $ctx.Chart.Name }}
    app.kubernetes.io/instance: {{ $ctx.Release.Name }}
    app.kubernetes.io/managed-by: {{ $ctx.Release.Service }}
spec:
  parentRefs:
    {{- toYaml $ctx.Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ $entry.host | quote }}
  rules:
    {{- range $entry.paths }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path | quote }}
      filters:
        {{- include "mojaloop-common.httproute.filters" $ctx | nindent 8 }}
      backendRefs:
        - name: {{ printf "%s-%s" $ctx.Release.Name .serviceName | quote }}
          port: {{ .servicePort }}
    {{- end }}
{{- end }}
{{- end }}
