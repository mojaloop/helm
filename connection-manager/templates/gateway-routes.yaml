{{- /*
  Gateway API HTTPRoutes for the MCM API and UI. Routes render in the release
  namespace and attach to the Gateways named in parentRefs; a Gateway in
  another namespace admits them through its listener's allowedRoutes.
*/}}
{{- if .Values.gateway.enabled -}}
{{- $fullname := include "connection-manager.fullname" . -}}
{{- if not .Values.api.disabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-api
  labels:
    app.kubernetes.io/component: api
{{ include "connection-manager.labels" . | indent 4 }}
spec:
  parentRefs:
    {{- toYaml (required "gateway.api.parentRefs is required when the gateway is enabled" .Values.gateway.api.parentRefs) | nindent 4 }}
  hostnames:
    {{- toYaml (required "gateway.api.hosts is required when the gateway is enabled" .Values.gateway.api.hosts) | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ $fullname }}-api
          port: {{ .Values.api.ports.containerPort }}
{{- end }}
{{- if not .Values.ui.disabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-ui
  labels:
    app.kubernetes.io/component: ui
{{ include "connection-manager.labels" . | indent 4 }}
spec:
  parentRefs:
    {{- toYaml (required "gateway.ui.parentRefs is required when the gateway is enabled" .Values.gateway.ui.parentRefs) | nindent 4 }}
  hostnames:
    {{- toYaml (required "gateway.ui.hosts is required when the gateway is enabled" .Values.gateway.ui.hosts) | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ $fullname }}-ui
          port: {{ .Values.ui.ports.containerPort }}
{{- end }}
{{- end }}
