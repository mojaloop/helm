{{- /*
  Gateway routes for the MCM UI and API. Each delegates auth to the shared
  Oathkeeper via the ExternalAuth filter and keys its backend for the IAM from
  api.authz and ui.authz.

  A cross-namespace oathkeeper reference needs a ReferenceGrant in the oathkeeper
  namespace
*/}}
{{- if .Values.gateway.enabled -}}
{{- $fullname := include "connection-manager.fullname" . -}}
{{- $oath := .Values.gateway.oathkeeper -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-api
  namespace: {{ .Release.Namespace }}
  {{- include "mojaloop-common.authz.annotations" (dict "backend" (printf "%s-api" $fullname) "authz" .Values.api.authz) | nindent 2 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.api.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml (required "gateway.api.hosts is required when the gateway is enabled" .Values.gateway.api.hosts) | nindent 4 }}
  rules:
    - filters:
        {{- with .Values.gateway.api.cors }}
        - type: CORS
          cors:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: {{ $oath.serviceName | quote }}
              namespace: {{ $oath.serviceNamespace | quote }}
              port: {{ $oath.servicePort }}
            http:
              path: /decisions
              allowedHeaders:
                - cookie
                - authorization
                - accept
                - x-forwarded-proto
      backendRefs:
        - name: {{ $fullname }}-api
          port: {{ .Values.api.ports.containerPort }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-ui
  namespace: {{ .Release.Namespace }}
  {{- include "mojaloop-common.authz.annotations" (dict "backend" (printf "%s-ui" $fullname) "authz" .Values.ui.authz) | nindent 2 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.ui.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml (required "gateway.ui.hosts is required when the gateway is enabled" .Values.gateway.ui.hosts) | nindent 4 }}
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: {{ $oath.serviceName | quote }}
              namespace: {{ $oath.serviceNamespace | quote }}
              port: {{ $oath.servicePort }}
            http:
              path: /decisions
              allowedHeaders:
                - cookie
                - accept
                - x-forwarded-proto
      backendRefs:
        - name: {{ $fullname }}-ui
          port: {{ .Values.ui.ports.containerPort }}
{{- end }}
