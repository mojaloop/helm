# Deployment overrides for the connection-manager chart:
#   helm install mcm ./connection-manager -n mojaloop -f mojaloop/values-deploy-mcm.example.yaml
#
# Replace the example.com FQDNs, switch identity, DB Secret and CSR fields
# with your deployment's actual values.

iam:
  enabled: true
  hydra:
    audience: connection-manager-api
  kratos:
    identitySchemaId: default
    inviteReturnToUrl: https://mcm.example.com/

# In-cluster IAM endpoints consumed by the MCM API container and the
# Oathkeeper rule templates. FQDNs assume the IAM stack is installed in
# the 'iam' namespace; override the host part if you put it elsewhere.
global:
  iam:
    keto:
      readUrl: http://keto-read.iam.svc.cluster.local
      writeUrl: http://keto-write.iam.svc.cluster.local
    hydra:
      adminUrl: http://hydra-admin.iam.svc.cluster.local
      publicUrl: http://hydra-public.iam.svc.cluster.local
    kratos:
      adminUrl: http://kratos-admin.iam.svc.cluster.local
      publicUrl: http://kratos-public.iam.svc.cluster.local

api:
  url: https://mcm.example.com
  clientUrl: https://mcm.example.com/
  switchId: your-switch-id
  switchFQDN: switch.example.com

ui:
  checkSessionUrl: https://kratos.example.com/sessions/whoami
  loginUrl: https://auth.example.com/login
  logoutUrl: https://auth.example.com/logout

db:
  host: mysql.example.com
  user: mcm
  passwordSecret: mcm-db-credentials
  passwordSecretKey: password
  schema: mcm

gateway:
  enabled: true
  host: mcm.example.com
  parentRefs:
    - name: mojaloop
      namespace: infra
      sectionName: https

config:
  tlsClientCSRParametersData: |-
    {
      "subject": {
        "CN": "Hub TLS Client",
        "O": "Your Organization",
        "OU": "IT Department",
        "C": "US",
        "ST": "Your State",
        "L": "Your City"
      },
      "extensions": {
        "subjectAltName": { "dns": [], "ips": [] }
      }
    }
  tlsServerCSRParametersData: |-
    {
      "subject": {
        "CN": "Hub TLS Server",
        "O": "Your Organization",
        "OU": "IT Department",
        "C": "US",
        "ST": "Your State",
        "L": "Your City"
      },
      "extensions": {
        "subjectAltName": { "dns": [], "ips": [] }
      }
    }
  caCSRParametersData: |-
    {
      "CN": "Hub Root CA",
      "O": "Your Organization",
      "OU": "IT Department",
      "C": "US",
      "ST": "Your State",
      "L": "Your City"
    }
