# Deployment overrides for the connection-manager chart:
#   helm install mcm ./connection-manager -n mojaloop -f mojaloop/values-deploy-mcm.example.yaml
#
# Replace the example.com FQDNs, switch identity, DB Secret and CSR fields
# with your deployment's actual values.

# The IAM installed in the iam namespace with values-deploy-iam.example.yaml;
# MCM calls its internal API, which admits MCM's API pods by network rule
global:
  iam:
    enabled: true
    provisioningUrl: http://ml-iam-services-api-internal.iam.svc.cluster.local

# Each onboarded DFSP is recorded as a participant; its invited admin and its
# machine client are assigned these AuthzRoles over it
iam:
  dfspResourceName: participant
  dfspAdminRole: dfsp-operator
  dfspClientRole: dfsp-client

api:
  url: https://mcm.example.com
  switchId: your-switch-id
  switchFQDN: switch.example.com
  authz:
    service: mcm

ui:
  authz:
    service: mcmUi
  checkSessionUrl: https://kratos.example.com/sessions/whoami
  loginUrl: https://auth.example.com/login
  logoutUrl: https://auth.example.com/logout

db:
  host: mysql.example.com
  user: mcm
  passwordSecret: mcm-db-credentials
  passwordSecretKey: password
  schema: mcm

gateway:
  enabled: true
  api:
    hosts:
      - mcm-api.example.com
    parentRefs:
      - name: mojaloop
        namespace: infra
        sectionName: https
  ui:
    hosts:
      - mcm.example.com
    parentRefs:
      - name: mojaloop
        namespace: infra
        sectionName: https

config:
  tlsClientCSRParametersData: |-
    {
      "subject": {
        "CN": "Hub TLS Client",
        "O": "Your Organization",
        "OU": "IT Department",
        "C": "US",
        "ST": "Your State",
        "L": "Your City"
      },
      "extensions": {
        "subjectAltName": { "dns": [], "ips": [] }
      }
    }
  tlsServerCSRParametersData: |-
    {
      "subject": {
        "CN": "Hub TLS Server",
        "O": "Your Organization",
        "OU": "IT Department",
        "C": "US",
        "ST": "Your State",
        "L": "Your City"
      },
      "extensions": {
        "subjectAltName": { "dns": [], "ips": [] }
      }
    }
  caCSRParametersData: |-
    {
      "CN": "Hub Root CA",
      "O": "Your Organization",
      "OU": "IT Department",
      "C": "US",
      "ST": "Your State",
      "L": "Your City"
    }
