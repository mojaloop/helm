apiVersion: v2
name: thirdparty-v2
version: 17.2.0
description: Third Party API Support for Mojaloop (v2.0 tracking chart)
appVersion: "auth-service: v15.2.7; als-consent-oracle: v1.1.7; thirdparty-sdk: v15.1.3; tpp-api-svc: v0.0.2"
home: https://mojaloop.io
icon: https://mojaloop.io/images/logo.png
sources:
  - https://github.com/mojaloop/mojaloop
  - https://github.com/mojaloop/helm
  - https://github.com/mojaloop/pisp-project
maintainers: []
dependencies:
  - name: auth-svc
    version: ">= 17.2.0"
    repository: "file://./chart-auth-svc"
    condition: auth-svc.enabled
  - name: consent-oracle
    version: ">= 17.2.0"
    repository: "file://./chart-consent-oracle"
    condition: consent-oracle.enabled
  - name: tpp-api-svc
    version: ">= 0.0.2"
    repository: "file://./chart-tpp-api-svc"
    condition: tpp-api-svc.enabled
  - name: mojaloop-simulator
    alias: thirdparty-simulator
    version: ">= 17.2.0"
    repository: "file://../mojaloop-simulator"
    condition: mojaloop-simulator.enabled
  - name: common
    repository: https://mojaloop.github.io/charts/repo
    version: 3.1.6
    tags:
      - moja-common
  - name: mojaloop-common
    repository: "file://../mojaloop-common"
    version: 0.1.0
    tags:
      - mojaloop-common
