apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authzseparations.iam.mojaloop.io
spec:
  group: iam.mojaloop.io
  scope: Namespaced
  names:
    kind: AuthzSeparation
    plural: authzseparations
    singular: authzseparation
    shortNames:
      - authzsep
    categories:
      - authz
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Within
          type: string
          jsonPath: .spec.within
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            Separation of duties: groups of permissions no one subject may
            hold across, through whatever roles. An assignment or a role that
            would give someone two groups is refused; subjects who already
            hold two when the rule arrives are listed, and keep what they
            hold.
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [groups]
              x-kubernetes-validations:
                - rule: "self.within != 'resource' || has(self.resourceName)"
                  message: within resource names the resource name it compares on
              properties:
                description:
                  type: string
                within:
                  description: >-
                    subject: no subject holds two groups, whatever the
                    resources. resource: no subject holds two groups over the
                    same resource of resourceName.
                  type: string
                  enum: [subject, resource]
                  default: subject
                resourceName:
                  type: string
                groups:
                  type: array
                  minItems: 2
                  items:
                    type: array
                    minItems: 1
                    items:
                      description: A permission id, <prefix>.<operationId>.
                      type: string
                      minLength: 1
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                violations:
                  description: Subjects that hold two groups.
                  type: array
                  items:
                    type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        description: Accepted, Refused, or Waiting for a service not composed yet.
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
