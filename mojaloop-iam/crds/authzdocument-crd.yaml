apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authzdocuments.iam.mojaloop.io
spec:
  group: iam.mojaloop.io
  scope: Namespaced
  names:
    kind: AuthzDocument
    plural: authzdocuments
    singular: authzdocument
    shortNames:
      - authzdoc
    categories:
      - authz
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            The OpenAPI document of a backend that does not serve its own: a
            third-party image, or one that is not to be changed. It is read
            only when an HTTPRoute in the same namespace names it with
            iam.mojaloop.io/<backend>.schema, and the route's
            iam.mojaloop.io/<backend>.service gives its operations their
            permission prefix. A document no route names does nothing.
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [document]
              properties:
                document:
                  description: >-
                    The OpenAPI 3.1 or later document, written inline as YAML
                    or JSON, with x-authz where an operation is scoped.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        description: Accepted, Refused, or Waiting while no route names it.
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
