apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authzdocuments.mojaloop.io
spec:
  group: mojaloop.io
  scope: Namespaced
  names:
    kind: AuthzDocument
    plural: authzdocuments
    singular: authzdocument
    shortNames:
      - authzdoc
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .status.service
        - name: State
          type: string
          jsonPath: .status.state
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            The OpenAPI document of a backend that does not serve its own: a
            third-party image, or one that is not to be changed. It is read
            only when an HTTPRoute in the same namespace names it with
            iam.mojaloop.io/<backend>.schema, and the route's
            iam.mojaloop.io/<backend>.service gives its operations their
            permission prefix. A document no route names does nothing.
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [document]
              properties:
                document:
                  description: >-
                    The OpenAPI 3.1 or later document, written inline as YAML
                    or JSON, with x-authz where an operation is scoped.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                service:
                  description: The permission prefixes the routes naming this document give it.
                  type: string
                state:
                  description: >-
                    Accepted when the gateway enforces what it describes.
                    Refused when it, or a prefix it is read under, is wrong;
                    that prefix keeps what it last composed to. Unreferenced
                    when no route names it.
                  type: string
                  enum: [Accepted, Refused, Unreferenced]
                messages:
                  description: What refused it, in the words the operator used.
                  type: array
                  items:
                    type: string
                observedGeneration:
                  description: The generation this status answers.
                  type: integer
