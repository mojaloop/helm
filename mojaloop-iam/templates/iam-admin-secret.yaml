{{- /*
  The password for the first identity, when the deployment did not bring its
  own Secret. Generated once and kept, so a re-render does not lock anyone out.
*/}}
{{- if and .Values.global.iamAdmin.email (eq .Values.global.iamAdmin.passwordSecret "") }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "iam-admin-password" }}
{{- $password := "" }}
{{- if and $existing $existing.data $existing.data.password }}
  {{- $password = $existing.data.password | b64dec }}
{{- else }}
  {{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: iam-admin-password
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
