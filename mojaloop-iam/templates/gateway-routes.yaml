{{- /*
  IdP routes, each gateway.hosts entry is a host string (routed via the shared
  gateway.parentRefs) or a {host, parentRefs} map for its own attachment
*/}}
{{- if .Values.gateway.enabled -}}
{{- $defaultRefs := .Values.gateway.parentRefs -}}
{{- range $route := list
  (dict "key" "hydra" "name" "hydra-public" "backend" "hydra-public" "enabled" true)
  (dict "key" "kratos" "name" "kratos-public" "backend" "kratos-public" "enabled" true)
  (dict "key" "auth" "name" "kratos-ui" "backend" "kratos-ui" "enabled" (index $.Values "kratos-ui" "enabled"))
  (dict "key" "mailpit" "name" "mailpit" "backend" "mailpit-http" "enabled" $.Values.mailpit.enabled)
}}
{{- $entry := index $.Values.gateway.hosts $route.key }}
{{- if and $entry $route.enabled }}
{{- $host := $entry }}
{{- $refs := $defaultRefs }}
{{- if kindIs "map" $entry }}{{ $host = $entry.host }}{{ $refs = $entry.parentRefs | default $defaultRefs }}{{ end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $route.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    {{- toYaml $refs | nindent 4 }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - filters:
        # The scope is the decision endpoint's word, so a client's own copy is
        # removed at the edge and cannot reach anything behind it.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Scope
      backendRefs:
        - name: {{ $route.backend }}
          port: 80
{{- end }}
{{- end }}
{{- with .Values.gateway.oathkeeperConsumerNamespaces }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: oathkeeper-consumers
  namespace: {{ $.Release.Namespace }}
spec:
  from:
    {{- range . }}
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ . | quote }}
    {{- end }}
  to:
    - group: ""
      kind: Service
      name: oathkeeper-api
{{- end }}
{{- end }}
