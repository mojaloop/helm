# Authorization is derived: each service's image carries its OpenAPI document
# (read via ImageVolume so scratch images work), and the IAM composes every
# registered document into this deployment's gateway rules, Keto model and
# catalog. A permission id two services claim, a request two services both
# match, or a resource type nothing accounts for fails the rollout.
#
# The deployment supplies the list, one entry per service:
#
#   - name: <service name>
#     image: <image carrying the document>
#     spec: <path to the document inside that image>
#     url:
#       host: <hostname the rules match>          # required
#       path: <mount point under a shared host>   # optional, omit at the root
#
# A micro-frontend adds a portal block, read as the remote manifest by the
# shell that composes it:
#
#     portal:
#       path: <where the shell mounts it>
#       label: <menu entry>
#       scope: <federated container it exposes>
#       permission: <namespace>:<object>#<permit>   # optional, gates the entry
#
# Ad-hoc rules outside a bundle go in as oathkeeper.ory.sh Rule CRs (maester
# controller mode)
global:
  authz: []
  # One real thing under several services' names, so an operator picks it once
  # and every service's spelling of it is bound. A type no path binds is
  # legitimate and has to appear here for the rollout to accept it.
  #
  #   Participant:
  #     label: Participant
  #     members:
  #       - { service: mcm, type: dfsps }
  #       - { service: reports, type: participants }
  resourceNames: {}
  # Composes the documents; the IAM's own image
  iamImage: mojaloop/ml-iam-services:v0.1.2
  # The deployment's roles, the assignments it ships with, and the pairs of
  # permissions it refuses to see in one pair of hands. Reviewed and versioned
  # like any other value: the provisioning service applies it when it starts,
  # and enforces the exclusions on every grant made after.
  #
  # A grant either names the resources of a scoped resource name (all, an id,
  # a list) or leaves the name open, and every open one is the assignment's to
  # name — which is what makes dfsp-operator below one role per Participant.
  #
  #   roles:
  #     hub-operator:
  #       grants:
  #         - permission: reports.getReport
  #           resources: { Report: all, Participant: all }
  #     dfsp-operator:
  #       grants:
  #         - permission: mcm.getDFSPca
  #   assignments:
  #     - { subject: <identity id>, role: hub-operator }
  #     - { subject: <identity id>, role: dfsp-operator, resources: { Participant: dfsp1 } }
  #   exclusions:
  #     - name: audit-exclusion
  #       a: [settlement.auditSettlement]
  #       b: [settlement.positionFundsInOut, settlement.positionNDCEdit]
  iamRoles:
    roles: {}
  # The first identity a fresh deployment logs in with. The provisioning
  # service creates it while applying the roles, puts it in `role`, and
  # invites it by email to set its password — the same courier flow every
  # other operator onboards through. Leave the email empty to create nobody,
  # which is what SSO deployments want. A passwordSecret grants a password
  # directly instead, for a deployment with no mail path.
  iamAdmin:
    email: ""
    role: hub-admin
    passwordSecret: ""
    passwordSecretKey: password

oathkeeper:
  enabled: true
  global:
    ory:
      oathkeeper:
        maester:
          mode: controller
  replicaCount: 1
  fullnameOverride: "oathkeeper"
  oathkeeper:
    config:
      log:
        level: info
        format: json
      access_rules:
        matching_strategy: regexp
        repositories:
          # Rules from oathkeeper.ory.sh Rule CRs (maester keeps this file)
          - file:///etc/rules/access-rules.json
          # The aggregate of all authz bundles, staged by the fetch-authz init
          - file:///etc/authz-rules/access-rules.yml
      authenticators:
        jwt:
          enabled: true
          config:
            jwks_urls:
              - http://hydra-public/.well-known/jwks.json
            # No audience requirement, Hydra serves only this platform's machine
            # clients and Keto authorizes by subject, a token proves identity and
            # the permit decides access (a multi-provider deployment can set an
            # audience here to isolate token reuse)
            target_audience: []
            # Hydra generates JWKS lazily on first use, 5s covers the cold keygen
            jwks_max_wait: 5s
        cookie_session:
          enabled: true
          config:
            check_session_url: http://kratos-public/sessions/whoami
            preserve_path: true
            preserve_query: true
            extra_from: "@this"
            subject_from: identity.id
            only:
              - ory_kratos_session
        anonymous:
          enabled: true
          config:
            subject: guest
        noop:
          enabled: true
      authorizers:
        allow:
          enabled: true
        deny:
          enabled: true
        remote_json:
          enabled: true
          config:
            # The decision endpoint: checks compose from Keto, and the resource
            # types a rule declares come back as the caller's visible set
            remote: http://ml-iam-services-decision/
            forward_response_headers_to_upstream:
              - X-Scope
            # Deny-safe default, the denied namespace fails every check, each rule sets its own payload
            payload: |
              {"namespace":"denied","object":"denied","relation":"denied","subject_id":"{{ print .Subject }}"}
      mutators:
        id_token:
          enabled: true
          config:
            issuer_url: http://oathkeeper-api:4456/
            jwks_url: http://oathkeeper:4456/.well-known/jwks.json
        header:
          enabled: true
          config:
            headers:
              X-User: '{{ print .Subject }}'
              X-Email: '{{ with .Extra.identity }}{{ print .traits.email }}{{ end }}'
              X-DFSP-ID: '{{ with .Extra.identity }}{{ with .metadata_public }}{{ with .dfspId }}{{ . }}{{ end }}{{ end }}{{ end }}'
              X-Roles: '{{ $r := list }}{{ with .Extra.identity }}{{ with .metadata_public }}{{ $r = .roles | default list }}{{ with .dfspId }}{{ $r = append $r (printf "dfsp:%s" .) }}{{ end }}{{ end }}{{ else }}{{ $r = list (printf "dfsp:%s" $.Subject) }}{{ end }}{{ toJson $r }}'
        noop:
          enabled: true
      errors:
        fallback:
          - json
        handlers:
          json:
            enabled: true
            config:
              verbose: true
          redirect:
            enabled: false
            config:
              to: ""
              when:
                - error: [unauthorized, forbidden]
                  request:
                    header:
                      accept: [text/html]
      serve:
        proxy:
          port: 4455
        api:
          port: 4456
    managedAccessRules: false
  # The rules the IAM composed. Kubernetes keeps the mounted file current and
  # Oathkeeper reloads the repository it names, so a service whose surface
  # changes reaches the gateway without a rollout. Optional because Oathkeeper
  # serves an empty rule set as 404, which is the right answer for a platform
  # that has not composed yet.
  deployment:
    extraVolumes:
      - name: authz-rules
        configMap:
          name: authz-published
          optional: true
          items:
            - key: access-rules.yml
              path: access-rules.yml
    extraVolumeMounts:
      - name: authz-rules
        mountPath: /etc/authz-rules
        readOnly: true
  maester:
    enabled: true
    oathkeeperFullnameOverride: 'oathkeeper'
  oathkeeper-maester:
    fullnameOverride: 'oathkeeper-maester'
    oathkeeperFullnameOverride: 'oathkeeper'
    deployment:
      envs:
        - name: authorizersAvailable
          value: allow,deny,remote_json
  serviceMonitor:
    scheme: http
    scrapeInterval: 60s
    scrapeTimeout: 30s

keto:
  enabled: true
  fullnameOverride: "keto"
  replicaCount: 1
  secret:
    enabled: false
    nameOverride: keto-secret
  service:
    metrics:
      enabled: true
      type: ClusterIP
      loadBalancerIP: ""
      name: http-metrics
      port: 80
      annotations: {}
  keto:
    command: ["keto"]
    automigration:
      enabled: true
      type: initContainer
    config:
      serve:
        read:
          port: 4466
        write:
          port: 4467
        metrics:
          port: 4468
      namespaces:
        location: file:///etc/keto-namespaces/namespaces.ts
  # The OPL model the IAM composed, at namespaces.location. Keto reads this
  # file to start and reloads it in place, so the seed it starts on becomes the
  # composition without a restart.
  deployment:
    extraVolumes:
      - name: authz-namespaces
        configMap:
          name: authz-published
          items:
            - key: keto-namespaces.ts
              path: namespaces.ts
    extraVolumeMounts:
      - name: authz-namespaces
        mountPath: /etc/keto-namespaces
        readOnly: true
  serviceMonitor:
    scheme: http
    scrapeInterval: 60s
    scrapeTimeout: 30s

kratos:
  enabled: true
  replicaCount: 1
  fullnameOverride: "kratos"
  secret:
    enabled: false
    nameOverride: kratos-secret
  courier:
    enabled: true
  deployment:
    extraVolumes:
      - name: courier-templates-recovery-valid
        configMap:
          name: kratos-courier-recovery-valid
    extraVolumeMounts:
      - name: courier-templates-recovery-valid
        mountPath: /conf/courier-templates/recovery/valid
        readOnly: true
  kratos:
    development: false
    automigration:
      enabled: true
      type: initContainer
    identitySchemas:
      "identity.default.schema.json": |
        {
          "$id": "https://mojaloop.io/kratos-schema/identity.schema.json",
          "$schema": "http://json-schema.org/draft-07/schema#",
          "title": "Person",
          "type": "object",
          "properties": {
            "traits": {
              "type": "object",
              "properties": {
                "email": {
                  "title": "E-Mail",
                  "type": "string",
                  "format": "email",
                  "minLength": 3,
                  "ory.sh/kratos": {
                    "credentials": {
                      "password": { "identifier": true },
                      "code": { "identifier": true, "via": "email" }
                    },
                    "recovery": { "via": "email" },
                    "verification": { "via": "email" }
                  }
                },
                "name": {
                  "title": "Name",
                  "type": "string"
                },
                "roles": {
                  "title": "User Roles",
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                }
              },
              "required": ["email"],
              "additionalProperties": false
            }
          }
        }
      "role-injection-body.jsonnet": |
        function(ctx) {
          identity_id: ctx.identity.id,
          user_subject: ctx.identity.traits.subject
        }
    config:
      identity:
        default_schema_id: default
        schemas:
          - id: default
            url: file:///etc/config/identity.default.schema.json
      serve:
        public:
          base_url: https://localhost/kratos/
          port: 4433
          cors:
            enabled: true
            allowed_origins:
              - https://*.localhost
        admin:
          port: 4434
      selfservice:
        default_browser_return_url: https://localhost/ui/welcome
        allowed_return_urls:
          - https://*.localhost
        methods:
          password:
            enabled: true
          code:
            enabled: true
            config:
              lifespan: 168h
          link:
            enabled: true
            config:
              lifespan: 168h
          oidc:
            enabled: true
          profile:
            enabled: false
        flows:
          login:
            ui_url: https://localhost/ui/login
            lifespan: 10m
            after:
              oidc:
                default_browser_return_url: https://localhost/ui/welcome
                hooks:
                  - hook: web_hook
                    config:
                      url: http://ml-iam-services-kratos-role-webhook/inject-roles
                      method: POST
                      body: file:///etc/config/role-injection-body.jsonnet
                      response:
                        parse: false
                      auth:
                        type: api_key
                        config:
                          name: Authorization
                          value: Bearer kratos-webhook-token
                          in: header
          error:
            ui_url: https://localhost/ui/error
          registration:
            after:
              oidc:
                hooks:
                  - hook: web_hook
                    config:
                      url: http://ml-iam-services-kratos-role-webhook/inject-roles
                      method: POST
                      body: file:///etc/config/role-injection-body.jsonnet
                      response:
                        parse: false
                      auth:
                        type: api_key
                        config:
                          name: Authorization
                          value: Bearer kratos-webhook-token
                          in: header
                  - hook: session
          recovery:
            enabled: true
            ui_url: https://localhost/ui/recovery
            use: link
            lifespan: 168h
          settings:
            ui_url: https://localhost/ui/settings
            privileged_session_max_age: 15m
            required_aal: highest_available
      log:
        level: info
        format: json
      ciphers:
        algorithm: xchacha20-poly1305
      hashers:
        algorithm: bcrypt
        bcrypt:
          cost: 8
      session:
        cookie:
          domain: localhost
      courier:
        template_override_path: /conf/courier-templates
        smtp:
          connection_uri: smtp://mailpit-smtp:25/?disable_starttls=true
          # Deployment values, noreply@<deployment domain> and the hub's display name
          from_address: noreply@mojaloop.local
          from_name: Mojaloop Hub
  serviceMonitor:
    enabled: true
    scheme: http
    scrapeInterval: 60s
    scrapeTimeout: 30s

hydra:
  enabled: true
  fullnameOverride: "hydra"
  # Serve admin/public on :80 so consumers reach hydra by bare service name
  service:
    public:
      port: 80
    admin:
      port: 80
  secret:
    enabled: false
    nameOverride: hydra-secret
  deployment:
    initContainerSecurityContext:
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
  hydra:
    automigration:
      enabled: true
      type: initContainer
    config:
      serve:
        cookies:
          same_site_mode: Lax
        public:
          cors:
            enabled: true
            allowed_origins:
              - "*"
      strategies:
        access_token: jwt
      oidc:
        subject_identifiers:
          supported_types:
            - public
      ttl:
        access_token: 1h
        id_token: 1h
        refresh_token: 720h
        auth_code: 10m
      log:
        level: info
        format: json

ml-iam-services:
  kratosRoleWebhook:
    env:
      KRATOS_ADMIN_URL: "http://kratos-admin"
      KETO_READ_URL: "http://keto-read"


kratos-ui:
  enabled: false
  fullnameOverride: kratos-ui

# Mailpit SMTP catcher for dev, the Kratos courier backend for invitation and
# recovery emails
mailpit:
  enabled: false
  fullnameOverride: mailpit

# Gateway API HTTPRoutes for the IdP surfaces, a hosts entry is a host string
# attached via the shared parentRefs, or a {host, parentRefs} map for its own
# attachment, a non-empty entry renders its HTTPRoute
gateway:
  enabled: false
  parentRefs: []
  hosts:
    hydra: ""
    kratos: ""
    auth: ""
    mailpit: ""
  # Namespaces whose HTTPRoutes call the Oathkeeper decision API via ExternalAuth,
  # rendered as a ReferenceGrant to the oathkeeper-api Service
  oathkeeperConsumerNamespaces: []

# External database, provision the databases and users externally (CNPG,
# Percona, managed cloud DB)
# Prod: leave host empty and supply the hydra/kratos/keto Secrets externally
# Dev/eval: set host and passwords, the chart builds the Secrets from them
database:
  host: ""
  port: 5432
  # postgres or mysql, Ory supports both
  type: postgres
  # DSN query params, per-driver defaults when empty
  params: ""
  hydra:
    database: hydra
    user: hydra
    password: ""
  kratos:
    database: kratos
    user: kratos
    password: ""
  keto:
    database: keto
    user: keto
    password: ""
