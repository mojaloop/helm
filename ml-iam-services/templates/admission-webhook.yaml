{{- if .Values.controller.webhook.enabled }}
{{- /*
  Admission for the IAM's kinds: the controller runs the checks it applies on
  every write and refuses what it would refuse. Failing closed, so no object
  is stored unchecked while the IAM is down.

  The controller answers admission from the moment it starts, before it is
  ready, and refuses what it cannot check yet with its own message. This
  Service publishes the pod while it is not ready so the API server reaches
  it then too.
*/}}
{{- $fullname := include "ml-iam-services.fullname" . }}
{{- $service := printf "%s-webhook" $fullname }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $service }}
  labels:
    {{- include "ml-iam-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
    - port: 443
      targetPort: webhook
      protocol: TCP
      name: webhook
  selector:
    {{- include "ml-iam-services.componentLabels" (dict "context" . "component" "controller") | nindent 4 }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ml-iam-services.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ml-iam-services.labels" . | nindent 4 }}
spec:
  secretName: {{ $fullname }}-webhook-tls
  dnsNames:
    - {{ $service }}.{{ .Release.Namespace }}.svc
  issuerRef:
    name: {{ $fullname }}-webhook
    kind: Issuer
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $fullname }}-admission
  labels:
    {{- include "ml-iam-services.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ $fullname }}-webhook
webhooks:
  - name: admission.iam.mojaloop.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: {{ $service }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 443
    rules:
      - apiGroups: [iam.mojaloop.io]
        apiVersions: [v1]
        resources: [authzdocuments, authzroles, authzseparations, authzresourcenames]
        operations: [CREATE, UPDATE]
        scope: Namespaced
      # A role another role's grants name by id stays until they no longer do
      - apiGroups: [iam.mojaloop.io]
        apiVersions: [v1]
        resources: [authzroles]
        operations: [DELETE]
        scope: Namespaced
{{- end }}
