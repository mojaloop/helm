{{- if .Values.provisioning.enabled }}
{{- /*
  What the IAM may do in the cluster: read the routes, the gateways they attach
  to, the documents routes name and the deployment's roles, separation rules
  and resource names, wherever they are; say on each route and object what
  became of it; and publish what it composed into its own namespace. No rule
  here reaches a secret or a workload.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ml-iam-services.fullname" . }}-provisioning
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ml-iam-services.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ml-iam-services.fullname" . }}-provisioning
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ml-iam-services.labels" . | nindent 4 }}
rules:
  # The composed rules and catalog, which the gateway and Keto read
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ml-iam-services.fullname" . }}-provisioning
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ml-iam-services.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ml-iam-services.fullname" . }}-provisioning
subjects:
  - kind: ServiceAccount
    name: {{ include "ml-iam-services.fullname" . }}-provisioning
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ml-iam-services.fullname" . }}-provisioning
  labels:
    {{- include "ml-iam-services.labels" . | nindent 4 }}
rules:
  - apiGroups: ["iam.mojaloop.io"]
    resources: ["authzdocuments", "authzroles", "authzseparations", "authzresourcenames"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["iam.mojaloop.io"]
    resources:
      - "authzdocuments/status"
      - "authzroles/status"
      - "authzseparations/status"
      - "authzresourcenames/status"
    verbs: ["get", "patch", "update"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ml-iam-services.fullname" . }}-provisioning
  labels:
    {{- include "ml-iam-services.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ml-iam-services.fullname" . }}-provisioning
subjects:
  - kind: ServiceAccount
    name: {{ include "ml-iam-services.fullname" . }}-provisioning
    namespace: {{ .Release.Namespace }}
{{- end }}
