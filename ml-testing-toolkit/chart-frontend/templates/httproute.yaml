{{- /*
  The route carries the ExternalAuth filter exactly when it keys its backend
  for the IAM: global.iam.enabled is on and authz.service names a prefix. The
  session cookie is the sole authenticator this surface declares; accept picks
  the error shape, a login redirect for a browser and a json 401 for anything
  else. A cross-namespace decision API reference needs a ReferenceGrant in its
  namespace.
*/}}
{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "ml-testing-toolkit-frontend.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  {{- include "mojaloop-common.authz.annotations" (dict "context" . "backend" (include "ml-testing-toolkit-frontend.fullname" .) "authz" .Values.authz) | nindent 2 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ required "gateway.host is required when the gateway is enabled" .Values.gateway.host | quote }}
  rules:
    - {{- with include "mojaloop-common.httproute.filters" . | trim }}
      filters:
        {{- . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ template "ml-testing-toolkit-frontend.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
