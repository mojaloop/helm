{{/*
  Mojaloop Common templates keying a route's backend for the IAM.

  A route names, per backend, the permission prefix that backend's operations
  answer under. A backend serving an API describes it in its own OpenAPI
  document, which the IAM reads from it. A surface with no API to describe —
  a single-page application, an API admitted or refused as a unit — is one
  permission over its whole mount: the chart names that one operation and
  writes its document here, and the route names that document.

    authz:
      service: ""          # the permission prefix; the deployment's to say
      operationId: view    # only for a surface with no API of its own
      title: Mojaloop Portal Roles UI
      summary: Opens the role administration view

  service is empty in a chart because which prefix a backend answers under is
  the deployment's to say. operationId, title and summary are the surface
  describing itself and do not change between deployments.

  Nothing here renders unless global.iam.enabled is on: with the IAM off it is
  not deployed, and neither are the kinds these objects are.

  Usage, with the name of the Service the route sends to:
    metadata:
      name: ...
      {{- include "mojaloop-common.authz.annotations" (dict "context" . "backend" $name "authz" .Values.authz) | nindent 2 }}

    {{ include "mojaloop-common.authzdocument" (dict "context" . "backend" $name "authz" .Values.authz) }}
*/}}
{{- define "mojaloop-common.authz.protected" -}}
{{- if and (dig "iam" "enabled" false (.context.Values.global | default dict)) (dig "service" "" (.authz | default dict)) }}true{{ end }}
{{- end }}

{{- define "mojaloop-common.authz.annotations" -}}
{{- if include "mojaloop-common.authz.protected" . -}}
annotations:
  iam.mojaloop.io/{{ .backend }}.service: {{ .authz.service | quote }}
  {{- if .authz.operationId }}
  iam.mojaloop.io/{{ .backend }}.schema: {{ .backend | quote }}
  {{- end }}
{{- end }}
{{- end }}

{{- define "mojaloop-common.authzdocument" -}}
{{- if and (include "mojaloop-common.authz.protected" .) .authz.operationId }}
{{- with .authz }}
apiVersion: iam.mojaloop.io/v1
kind: AuthzDocument
metadata:
  name: {{ $.backend }}
  namespace: {{ $.context.Release.Namespace | quote }}
spec:
  document:
    openapi: 3.1.0
    info:
      title: {{ required "authz.title is required" .title | quote }}
      version: '1.0'
    servers:
      - url: /
    paths:
      /:
        get:
          operationId: {{ .operationId | quote }}
          summary: {{ required "authz.summary is required: it is what an operator reads when granting this" .summary | quote }}
          x-authz:
            scopedBy: []
          responses:
            '200':
              description: The surface
{{- end }}
{{- end }}
{{- end }}
