{{/*
  Mojaloop Common template for Gateway API routing.

  Usage for a chart whose service answers on one port:
    {{ include "mojaloop-common.httproute" (dict "context" . "fullname" (include "<chart>.fullname" .)) }}

  A chart that splits paths across several service ports writes its own
  HTTPRoute and reuses the filter list on each rule:
    {{- include "mojaloop-common.httproute.filters" . | nindent 8 }}

  A chart whose routes key different backends under different authz values
  adds the ExternalAuth filter per route:
    {{- include "mojaloop-common.httproute.externalAuth" (dict "context" . "authz" .Values.api.authz "allowedHeaders" (list "cookie" "authorization" "accept")) | nindent 8 }}

  The caller passes its own fullname because each chart names its Service with
  its own helper, and the route's backendRef has to resolve to that Service.
  The chart's authz values key that backend for the IAM (see authzdocument.yaml).

  A route carries the ExternalAuth filter exactly when it keys its backend
  for the IAM: global.iam.enabled is on and authz.service names a prefix. A
  keyed backend behind a route without the filter would be protected by
  annotation and open in fact, so no value produces one.

  The decision endpoint's whole response is copied onto the request, so what a
  decision carries stays between it and the service that reads it.

  A cross-namespace decision-endpoint reference needs a ReferenceGrant in its
  namespace.
*/}}
{{- define "mojaloop-common.httproute.externalAuth" -}}
{{- if include "mojaloop-common.authz.protected" . }}
{{- $oath := .oathkeeper | default .context.Values.gateway.oathkeeper }}
- type: ExternalAuth
  externalAuth:
    protocol: HTTP
    backendRef:
      name: {{ $oath.serviceName | quote }}
      {{- with $oath.serviceNamespace }}
      namespace: {{ . | quote }}
      {{- end }}
      port: {{ $oath.servicePort }}
    http:
      path: /decisions
      allowedHeaders:
        {{- toYaml (.allowedHeaders | default (list "cookie" "accept")) | nindent 8 }}
{{- end }}
{{- end }}

{{- define "mojaloop-common.httproute.filters" -}}
{{- with .Values.gateway.cors }}
- type: CORS
  cors:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- /* The session cookie is the sole authenticator a surface declares by
       default; accept picks the error shape, a login redirect for a browser
       and a json 401 for anything else */}}
{{- include "mojaloop-common.httproute.externalAuth" (dict "context" . "authz" .Values.authz) }}
{{- end }}

{{- define "mojaloop-common.httproute.metadata" -}}
metadata:
  name: {{ .fullname }}
  namespace: {{ .context.Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .context.Chart.Name }}
    app.kubernetes.io/instance: {{ .context.Release.Name }}
    app.kubernetes.io/managed-by: {{ .context.Release.Service }}
  {{- include "mojaloop-common.authz.annotations" (dict "context" .context "backend" .fullname "authz" .context.Values.authz) | nindent 2 }}
{{- end }}

{{- define "mojaloop-common.httproute" -}}
{{- $ctx := .context -}}
{{- $fullname := .fullname -}}
{{- if $ctx.Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
{{ include "mojaloop-common.httproute.metadata" . }}
spec:
  parentRefs:
    {{- toYaml $ctx.Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ required "gateway.host is required when the gateway is enabled" $ctx.Values.gateway.host | quote }}
  rules:
    - {{- with include "mojaloop-common.httproute.filters" $ctx | trim }}
      filters:
        {{- . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ $fullname }}
          port: {{ $ctx.Values.service.port }}
{{- with include "mojaloop-common.authzdocument" (dict "context" $ctx "backend" $fullname "authz" $ctx.Values.authz) }}
---
{{ . }}
{{- end }}
{{- end }}
{{- end }}
