apiVersion: v2
description: Example Helm chart for mojaloop backend dependencies
name: example-mojaloop-backend
version: 17.2.0
appVersion: "nginx: 4.12.0; mysql: 14.0.3; kafka: 32.4.3; mongodb: 18.6.1; redis: 25.3.2"
home: http://mojaloop.io
icon: http://mojaloop.io/images/logo.png
sources:
  - https://github.com/mojaloop/mojaloop
  - https://github.com/mojaloop/helm
maintainers:
  - name: Miguel de Barros
    email: miguel.debarros@modusbox.com
  - name: Vijay Kumar Guthi
    email: vijaya.guthi@modusbox.com
  - name: Sam Kummary
    email: skummary@mojaloop.io
dependencies:
  - name: kafka
    alias: kafka
    condition: kafka.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - mojaloop
      - dependency
      - backend
      - kafka
    version: 31.5.0 ## 32.4.3 version is not working with the current values, need investigate the issue and set the configuration properly
  ## mysql database
  - name: mysql
    alias: mysql
    condition: mysql.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - mojaloop
      - dependency
      - backend
      - mysql
      - centralledger
      - account-lookup
    version: 14.0.3
  ## Bulk backend
  - name: mongodb
    alias: cl-mongodb
    condition: cl-mongodb.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - mojaloop
      - dependency
      - backend
      - mongodb
      - centralledger
    version: 18.6.1
  ## Central-event-processor backend
  - name: mongodb
    alias: cep-mongodb
    condition: cep-mongodb.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - mojaloop
      - dependency
      - backend
      - mongodb
      - centralledger
    version: 18.6.1
  - name: mongodb
    alias: ttk-mongodb
    condition: ttk-mongodb.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - mojaloop
      - dependency
      - backend
      - mongodb
      - centralledger
    version: 18.6.1
  ## Redis for SDK-Scheme-Adapter that are part of the TTKSims
  - name: redis
    alias: ttksims-redis
    condition: ttksims-redis.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - mojaloop
      - dependency
      - backend
      - redis
      - sdk
      - bulk
      - ttksims
    version: 25.3.2
  ## Redis for Thirdparty Auth-Service
  - name: redis
    alias: auth-svc-redis
    condition: auth-svc-redis.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - mojaloop
      - dependency
      - backend
      - redis
      - thirdparty
    version: 25.3.2
  ## Redis Cluster for Proxy Cache
  - name: redis-cluster
    alias: proxy-cache-redis
    condition: proxy-cache-redis.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - mojaloop
      - dependency
      - backend
      - redis
      - proxy
    version: 10.2.8
  ## Redis for Proxy Cache
  - name: redis
    alias: proxy-cache-redis-standalone
    condition: proxy-cache-redis-standalone.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - mojaloop
      - dependency
      - backend
      - redis
      - proxy
    version: 25.3.2
  ## PostgreSQL for the Ory IAM stack (hydra / kratos / keto databases)
  - name: postgresql
    alias: iam-postgres
    condition: iam-postgres.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - mojaloop
      - dependency
      - backend
      - postgres
      - iam
    version: 16.7.27
  ## MySQL for the Connection Manager (MCM) database
  - name: mysql
    alias: mcm-mysql
    condition: mcm-mysql.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - mojaloop
      - dependency
      - backend
      - mysql
      - mcm
    version: 14.0.3
  ## OpenBao (Vault) for the Connection Manager PKI / secrets engine
  - name: openbao
    alias: openbao
    condition: openbao.enabled
    repository: oci://ghcr.io/openbao/charts
    tags:
      - mojaloop
      - dependency
      - backend
      - vault
      - mcm
    version: 0.28.4
