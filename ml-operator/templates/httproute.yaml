{{- /*
  The route carries the ExternalAuth filter exactly when it keys its backend
  for the IAM: global.iam.enabled is on and image-watcher.authz.service names
  a prefix.
*/}}
{{- $gw := index .Values "image-watcher" "gateway" -}}
{{- $authz := index .Values "image-watcher" "authz" | default dict -}}
{{- $protected := and (dig "iam" "enabled" false (.Values.global | default dict)) $authz.service -}}
{{- if $gw.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: image-watcher
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: ml-operator
    {{- include "ml-operator.labels" . | nindent 4 }}
  {{- if $protected }}
  annotations:
    iam.mojaloop.io/image-watcher.service: {{ $authz.service | quote }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $gw.parentRefs | nindent 4 }}
  hostnames:
    - {{ required "image-watcher.gateway.host is required when the gateway is enabled" $gw.host | quote }}
  rules:
    - {{- if or $gw.cors $protected }}
      filters:
        {{- with $gw.cors }}
        - type: CORS
          cors:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- if $protected }}
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: {{ $gw.oathkeeper.serviceName | quote }}
              {{- with $gw.oathkeeper.serviceNamespace }}
              namespace: {{ . | quote }}
              {{- end }}
              port: {{ $gw.oathkeeper.servicePort }}
            http:
              path: /decisions
              allowedHeaders:
                - cookie
                - accept
        {{- end }}
      {{- end }}
      backendRefs:
        - name: image-watcher
          port: {{ index .Values "image-watcher" "service" "port" }}
{{- end }}
